name: iOS Core

on:
  workflow_dispatch:
  pull_request:
    branches: [ios-development]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-core.yml'

concurrency:
  group: ios-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test iOS calculation core
        working-directory: ios
        run: swift test
