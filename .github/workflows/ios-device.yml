name: iOS Device Build

on:
  push:
    branches: [ios-development]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-device.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-device.yml'

jobs:
  device-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for physical iPhone architecture
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project C8Calculations.xcodeproj \
            -scheme C8Calculations \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath device-build \
            build
