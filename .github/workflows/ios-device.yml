name: iOS Device Build

on:
  push:
    branches: [ios-development]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-device.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-device.yml'

jobs:
  device-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for physical iPhone architecture
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project C8Calculations.xcodeproj \
            -scheme C8Calculations \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath device-build \
            build
      - name: Package unsigned device app
        run: |
          APP_PATH="$(find ios/device-build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Packaging $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" C8Calculations-iOS-Device-unsigned.zip
      - name: Upload unsigned device app
        uses: actions/upload-artifact@v4
        with:
          name: C8Calculations-iOS-Device-unsigned
          path: C8Calculations-iOS-Device-unsigned.zip
          if-no-files-found: error
