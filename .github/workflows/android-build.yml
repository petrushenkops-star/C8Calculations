name: Android APK
# CI validates pull requests before merging releases.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Restore signing key
        env:
          C8_KEYSTORE_BASE64: ${{ secrets.C8_KEYSTORE_BASE64 }}
        run: |
          test -n "$C8_KEYSTORE_BASE64"
          printf '%s' "$C8_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/c8-release.jks"
          test -s "$RUNNER_TEMP/c8-release.jks"
          echo "ae09c0e0ded36d869e4fbd4b0cfb4f4459e990c2a2503e338a65aa024a654574  $RUNNER_TEMP/c8-release.jks" | sha256sum -c -
      - name: Validate signing key
        env:
          C8_KEYSTORE_PASSWORD: ${{ secrets.C8_KEYSTORE_PASSWORD }}
          C8_KEY_ALIAS: ${{ secrets.C8_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/c8-release.jks" -storepass "$C8_KEYSTORE_PASSWORD" -alias "$C8_KEY_ALIAS"
      - name: Build signed release APK
        env:
          C8_KEYSTORE_PATH: ${{ runner.temp }}/c8-release.jks
          C8_KEYSTORE_PASSWORD: ${{ secrets.C8_KEYSTORE_PASSWORD }}
          C8_KEY_ALIAS: ${{ secrets.C8_KEY_ALIAS }}
          C8_KEY_PASSWORD: ${{ secrets.C8_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK signature and certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/C8Calculations-v${{ steps.version.outputs.version_name }}-release.apk"
      - name: Verify release APK exists
        run: test -f "app/build/outputs/apk/release/C8Calculations-v${{ steps.version.outputs.version_name }}-release.apk"
      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="v$VERSION_NAME"
          APK="app/build/outputs/apk/release/C8Calculations-v${VERSION_NAME}-release.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its existing permanent asset."
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
      - name: Remove old Android Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.head_branch == "main") | select(.name | startswith("C8Calculations-v")) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r artifact_id artifact_name; do
            test -n "$artifact_id" || continue
            echo "Deleting old artifact: $artifact_name ($artifact_id)"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
      - name: Upload temporary signed APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: C8Calculations-v${{ steps.version.outputs.version_name }}-release
          path: app/build/outputs/apk/release/C8Calculations-v${{ steps.version.outputs.version_name }}-release.apk
          if-no-files-found: error
          retention-days: 3
