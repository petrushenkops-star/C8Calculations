name: Android APK
# CI validates pull requests before merging releases.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

  release:
    needs: test-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore signing key
        env:
          C8_KEYSTORE_BASE64: ${{ secrets.C8_KEYSTORE_BASE64 }}
        run: |
          test -n "$C8_KEYSTORE_BASE64"
          printf '%s' "$C8_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/c8-release.jks"
          test -s "$RUNNER_TEMP/c8-release.jks"
          echo "ae09c0e0ded36d869e4fbd4b0cfb4f4459e990c2a2503e338a65aa024a654574  $RUNNER_TEMP/c8-release.jks" | sha256sum -c -
      - name: Validate signing key
        env:
          C8_KEYSTORE_PASSWORD: ${{ secrets.C8_KEYSTORE_PASSWORD }}
          C8_KEY_ALIAS: ${{ secrets.C8_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/c8-release.jks" -storepass "$C8_KEYSTORE_PASSWORD" -alias "$C8_KEY_ALIAS"
      - name: Build signed release APK
        env:
          C8_KEYSTORE_PATH: ${{ runner.temp }}/c8-release.jks
          C8_KEYSTORE_PASSWORD: ${{ secrets.C8_KEYSTORE_PASSWORD }}
          C8_KEY_ALIAS: ${{ secrets.C8_KEY_ALIAS }}
          C8_KEY_PASSWORD: ${{ secrets.C8_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature and certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Rename release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/C8Calculations-v1.0.0-release.apk
      - name: Verify release APK exists
        run: test -f app/build/outputs/apk/release/C8Calculations-v1.0.0-release.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: C8Calculations-v1.0.0-release
          path: app/build/outputs/apk/release/C8Calculations-v1.0.0-release.apk
          if-no-files-found: error
          retention-days: 30
