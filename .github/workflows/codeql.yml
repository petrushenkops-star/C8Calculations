name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "20 22 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL for Java/Kotlin
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/init@v4
        env:
          # Overlay databases require build-mode "none", while Kotlin requires
          # a traced build. Disable overlay mode to keep the precise manual build
          # without the fallback warning.
          CODEQL_OVERLAY_DATABASE_MODE: none
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Initialize CodeQL for GitHub Actions
        if: matrix.language == 'actions'
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Build Android debug variant
        if: matrix.language == 'java-kotlin'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
