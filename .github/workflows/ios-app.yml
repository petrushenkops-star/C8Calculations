name: iOS App Build

on:
  push:
    branches: [ios-development]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-app.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-app.yml'

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build iPhone app for Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project C8Calculations.xcodeproj \
            -scheme C8Calculations \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build
      - name: Package Simulator app
        run: |
          APP_PATH="$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Packaging $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" C8Calculations-iOS-Simulator.zip
      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: C8Calculations-iOS-Simulator
          path: C8Calculations-iOS-Simulator.zip
          if-no-files-found: error
