name: iOS App Build

on:
  push:
    branches: [ios-development]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-app.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-app.yml'

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build iPhone app for Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project C8Calculations.xcodeproj \
            -scheme C8Calculations \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
