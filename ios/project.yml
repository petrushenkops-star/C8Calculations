name: C8Calculations
options:
  bundleIdPrefix: com.pavel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
packages:
  C8CalculationsCore:
    path: .
targets:
  C8Calculations:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: C8CalculationsCore
        product: C8CalculationsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pavel.c8calculations
        PRODUCT_NAME: "С8 расчеты"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "С8 расчеты"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
